# Modular RAG MCP Server - Configuration
# Local-English-literature-RAG scenario: absolute local LLM (zero cloud dependency).
# User's private PDFs must not leave the machine — P0 privacy compliance.

# =============================================================================
# LLM Configuration
# =============================================================================
llm:
  provider: "zhipu"  # 云端智谱 glm-4-flash（免费）；用户选择，granite4.1:8b 不再使用
  model: "glm-4-flash"
  deployment_name: ""
  azure_endpoint: ""
  api_version: ""
  api_key: ""  # 从 .env 的 ZHIPUAI_API_KEY 读取（ZhipuLLM 支持 env var；key 不入库）
  base_url: "https://open.bigmodel.cn/api/paas/v4"  # 智谱 OpenAI 兼容端点（BigModel v4）
  temperature: 0.0
  max_tokens: 4096

# =============================================================================
# Embedding Configuration
# =============================================================================
embedding:
  provider: "ollama"  # 本地 Ollama；决策见 D-014/D-030。base_url from $OLLAMA_BASE_URL（default http://localhost:11434），httpx 需 trust_env=False 绕系统代理
  model: "bge-m3"  # D-030 A/B 选型胜者（中文语料 precision@5 0.787 vs nomic 0.693）；见 docs/embedding-ab-zh.md
  dimensions: 1024  # bge-m3 output dim; reported to vector store via get_dimension
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: ""  # read from ZHIPUAI_API_KEY env var
  base_url: "http://localhost:11434/v1"

# =============================================================================
# Vision LLM Configuration (Ollama local)
# =============================================================================
vision_llm:
  enabled: true  # 默认启用（D-020）；ImageCaptioner 据此决定是否调 Vision LLM
  provider: "ollama"  # 本地 Vision LLM；决策见 D-020 / D-031 换型
  model: "qwen3-vl:4b"  # D-031: 图表/文档理解升级（6GB 显存上限选 4b）；llava-phi3 为旧默认
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: ""
  base_url: "http://localhost:11434/v1"
  max_image_size: 2048

# =============================================================================
# Vector Store Configuration
# =============================================================================
vector_store:
  provider: "chroma"
  persist_directory: "./data/db/chroma"
  collection_name: "knowledge_hub"

# =============================================================================
# Retrieval Configuration
# =============================================================================
retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60

# =============================================================================
# Rerank Configuration (disabled per user choice)
# =============================================================================
rerank:
  enabled: false
  provider: "none"
  model: "none"
  top_k: 5

# =============================================================================
# Generation Configuration (query-side LLM answer synthesis, D-027)
# =============================================================================
generation:
  enabled: true       # 检索后由 LLM 生成带 [n] 引用标记的总结（settings.llm 后端）
  max_chunks: 10      # 喂给 LLM 的 chunk 上限（编号与响应引用列表一致）
  max_chunk_chars: 1500    # 单 chunk 上下文截断
  max_context_chars: 12000 # 总上下文截断（前序优先）

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  enabled: true
  provider: "composite"
  backends:
    - "custom"
    - "ragas"
  metrics:
    - "source_recall_at_k"
    - "source_precision_at_k"
    - "context_relevance"
    - "context_precision"
    - "context_recall"

# =============================================================================
# Observability Configuration
# =============================================================================
observability:
  log_level: "INFO"
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

# =============================================================================
# Ingestion Configuration
# =============================================================================
ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"
  batch_size: 10  # DashScope text-embedding-v4 max 10/request

  # Parser Configuration (K1) — pluggable document parser (renamed from loader).
  # Switching formats (pdf | pdf_text | docx | ...) is config-only via ParserFactory.
  parser:
    provider: "docling"  # 默认 parser = Docling（DocLayNet + TableFormer）；矢量图 bbox 渲染见 D-019，降级链 docling→pdf_text 见 D-011
    extract_images: true  # extract embedded images, insert [IMAGE: id] placeholders

  chunk_refiner:
    use_llm: false  # 策略 C:先关 LLM 精炼层(溯源优先确定性),规则去噪层仍恒执行;不满意再开
    # When use_llm is false or LLM call fails, falls back to rule-based refinement
  
  # Metadata Enricher Configuration (C6)
  metadata_enricher:
    use_llm: false # Set to true to enable LLM-based enrichment (requires LLM config)
    # When use_llm is false or LLM call fails, falls back to rule-based enrichment
