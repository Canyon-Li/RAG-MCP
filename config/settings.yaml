# Modular RAG MCP Server - Configuration
# Generated by setup skill. Provider: Zhipu (智谱 GLM, OpenAI-compatible).
# API key is read from the ZHIPUAI_API_KEY environment variable.

# =============================================================================
# LLM Configuration
# =============================================================================
llm:
  provider: "zhipu"
  model: "glm-4-flash"
  deployment_name: ""
  azure_endpoint: ""
  api_version: ""
  api_key: ""  # read from ZHIPUAI_API_KEY env var
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  temperature: 0.0
  max_tokens: 4096

# =============================================================================
# Embedding Configuration
# =============================================================================
embedding:
  provider: "zhipu"
  model: "embedding-3"
  dimensions: 2048  # embedding-3 default; reported to vector store via get_dimension
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: ""  # read from ZHIPUAI_API_KEY env var
  base_url: "https://open.bigmodel.cn/api/paas/v4"

# =============================================================================
# Vision LLM Configuration (disabled per user choice)
# =============================================================================
vision_llm:
  enabled: false
  provider: "qwen"
  model: "qwen-vl-max"
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: ""
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
  max_image_size: 2048

# =============================================================================
# Vector Store Configuration
# =============================================================================
vector_store:
  provider: "chroma"  # Options: chroma, qdrant, pinecone
  persist_directory: "./data/db/chroma"
  collection_name: "knowledge_hub"

# =============================================================================
# Retrieval Configuration
# =============================================================================
retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60  # RRF constant

# =============================================================================
# Rerank Configuration
# =============================================================================
rerank:
  enabled: false
  provider: "none"  # Options: none, cross_encoder, llm
  model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  top_k: 5

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  enabled: false
  provider: "custom"  # Options: ragas, deepeval, custom
  metrics:
    - "hit_rate"
    - "mrr"
    - "faithfulness"

# =============================================================================
# Observability Configuration
# =============================================================================
observability:
  log_level: "INFO"  # Options: DEBUG, INFO, WARNING, ERROR
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

# =============================================================================
# Ingestion Configuration
# =============================================================================
ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"  # Options: recursive, semantic, fixed_length
  batch_size: 100
  
  # Chunk Refiner Configuration (C5)
  chunk_refiner:
    use_llm: true  # Set to true to enable LLM-based refinement (requires LLM config)
    # When use_llm is false or LLM call fails, falls back to rule-based refinement
  
  # Metadata Enricher Configuration (C6)
  metadata_enricher:
    use_llm: true  # Set to true to enable LLM-based enrichment (requires LLM config)
    # When use_llm is false or LLM call fails, falls back to rule-based enrichment
