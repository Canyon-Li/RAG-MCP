# Modular RAG MCP Server - Configuration
# Generated by setup skill. Provider: Zhipu (智谱 GLM, OpenAI-compatible).
# API key is read from the ZHIPUAI_API_KEY environment variable.

# =============================================================================
# LLM Configuration
# =============================================================================
llm:
  provider: "zhipu"
  model: "glm-4-flash"
  deployment_name: ""
  azure_endpoint: ""
  api_version: ""
  api_key: ""  # read from ZHIPUAI_API_KEY env var
  base_url: "https://open.bigmodel.cn/api/paas/v4"
  temperature: 0.0
  max_tokens: 4096

# =============================================================================
# Embedding Configuration
# =============================================================================
embedding:
  provider: "ollama"  # local Ollama; base_url from $OLLAMA_BASE_URL (default http://localhost:11434)
  model: "nomic-embed-text"
  dimensions: 768  # nomic-embed-text output dim; reported to vector store via get_dimension
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: ""  # read from ZHIPUAI_API_KEY env var
  base_url: "https://open.bigmodel.cn/api/paas/v4"

# =============================================================================
# Vision LLM Configuration (Ollama local)
# =============================================================================
vision_llm:
  enabled: true
  provider: "ollama"
  model: "llava-phi3:3.8b"
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: ""
  base_url: "http://localhost:11434/v1"
  max_image_size: 2048

# =============================================================================
# Vector Store Configuration
# =============================================================================
vector_store:
  provider: "chroma"
  persist_directory: "./data/db/chroma"
  collection_name: "knowledge_hub"

# =============================================================================
# Retrieval Configuration
# =============================================================================
retrieval:
  dense_top_k: 20
  sparse_top_k: 20
  fusion_top_k: 10
  rrf_k: 60

# =============================================================================
# Rerank Configuration (disabled per user choice)
# =============================================================================
rerank:
  enabled: false
  provider: "none"
  model: "none"
  top_k: 5

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  enabled: false
  provider: "custom"
  metrics:
    - "hit_rate"
    - "mrr"
    - "faithfulness"

# =============================================================================
# Observability Configuration
# =============================================================================
observability:
  log_level: "INFO"
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

# =============================================================================
# Ingestion Configuration
# =============================================================================
ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"
  batch_size: 10  # DashScope text-embedding-v4 max 10/request

  # Parser Configuration (K1) — pluggable document parser (renamed from loader).
  # Switching formats (pdf | pdf_text | docx | ...) is config-only via ParserFactory.
  parser:
    provider: "docling"  # Docling (DocLayNet + TableFormer) layout + table extraction
    extract_images: true  # extract embedded images, insert [IMAGE: id] placeholders

  chunk_refiner:
    use_llm: true  # Set to true to enable LLM-based refinement (requires LLM config)
    # When use_llm is false or LLM call fails, falls back to rule-based refinement
  
  # Metadata Enricher Configuration (C6)
  metadata_enricher:
    use_llm: true  # Set to true to enable LLM-based enrichment (requires LLM config)
    # When use_llm is false or LLM call fails, falls back to rule-based enrichment
