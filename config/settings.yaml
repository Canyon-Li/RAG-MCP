# Modular RAG MCP Server - Configuration
# Local-English-literature-RAG scenario: absolute local LLM (zero cloud dependency).
# User's private PDFs must not leave the machine — P0 privacy compliance.

# =============================================================================
# LLM Configuration
# =============================================================================
llm:
  provider: "deepseek"  # 2026-09-17 收尾定版留用（T22 生成质量实验切换，faithfulness +18pt；原 ollama/granite4.1:8b）
  model: "deepseek-flash"
  deployment_name: ""
  azure_endpoint: ""
  api_version: ""
  api_key: ""  # 留空走 DEEPSEEK_API_KEY 环境变量（.env，evaluate.py 会 load_dotenv）
  base_url: "https://api.deepseek.com"
  temperature: 0.0
  max_tokens: 8192  # 思考默认开（OpenAILLM 不透传 extra_body 关不掉）——推理 token 吃生成额度，必须放大

# =============================================================================
# Embedding Configuration
# =============================================================================
embedding:
  provider: "ollama"  # 本地 Ollama（nomic-embed-text）；决策见 D-014。base_url from $OLLAMA_BASE_URL（default http://localhost:11434），httpx 需 trust_env=False 绕系统代理
  model: "nomic-embed-text"
  dimensions: 768  # nomic-embed-text output dim; reported to vector store via get_dimension
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: ""  # read from ZHIPUAI_API_KEY env var
  base_url: "http://localhost:11434/v1"

# =============================================================================
# Vision LLM Configuration (Ollama local)
# =============================================================================
vision_llm:
  enabled: true  # 默认启用（D-020）；ImageCaptioner 据此决定是否调 Vision LLM
  provider: "ollama"  # 本地 Vision LLM；决策见 D-020
  model: "qwen2.5vl-3b:latest"  # D-020 原为 llava-phi3:3.8b；本机未装，换成本地已有标签
  azure_endpoint: ""
  deployment_name: ""
  api_version: ""
  api_key: ""
  base_url: "http://localhost:11434/v1"
  max_image_size: 2048

# =============================================================================
# Vector Store Configuration
# =============================================================================
vector_store:
  provider: "chroma"
  persist_directory: "./data/db/chroma"
  collection_name: "knowledge_hub"

# =============================================================================
# Retrieval Configuration
# =============================================================================
retrieval:
  dense_top_k: 40  # T22 D1: 20→40——浅漏检主张的 home 排 21~46 名，加深 dense 捞回（模拟 +3 条/0 丢失）
  sparse_top_k: 35  # T22 D1: 10→35——T14 截尾结论针对池 10 场景，D1 大池下按扫描赢家同步加深
  fusion_top_k: 10
  rrf_k: 60
  filter_references: true  # T19: query 侧 references 段过滤——融合全池检测剔出后再截断（rerank 重打分会洗掉降位，必须剔出+回填）；治 q7/q4 型参考文献段侵入
  rerank_pool_multiplier: 5  # T22 D1: 重排候选池 = 最终 top_k×5（原三处硬编码 ×2 → 池 10，现池 25）；不写此 key = 缺省 2 = 旧行为

# =============================================================================
# Rerank Configuration (T15: cross-encoder enabled)
# =============================================================================
rerank:
  enabled: true  # T15: bge-reranker-v2-m3 重排 RRF 融合候选（C 桶机制正面攻）
  provider: "cross_encoder"
  model: "D:/models/bge-reranker-v2-m3"  # ModelScope 本地快照（HF 直连/hf-mirror 均被断，见 T15 Resolution）；CrossEncoder 走本地路径零联网
  top_k: 5  # 仅 MCP 查询路径默认深度；eval 侧显式传 top_k=10（2× 候选→重排→截断），不混变量

# =============================================================================
# Evaluation Configuration
# =============================================================================
evaluation:
  enabled: true
  provider: "composite"
  backends:
    - "ragas"  # T20: custom 退出默认（source_*/hit_rate/mrr 已随 v4.0 退役；计算路径保留，历史 run 仍可复算）
  metrics:
    - "faithfulness"
    - "answer_relevancy"
    - "context_precision"
    - "context_recall"

# =============================================================================
# Observability Configuration
# =============================================================================
observability:
  log_level: "INFO"
  trace_enabled: true
  trace_file: "./logs/traces.jsonl"
  structured_logging: true

# =============================================================================
# Ingestion Configuration
# =============================================================================
ingestion:
  chunk_size: 1000
  chunk_overlap: 200
  splitter: "recursive"
  batch_size: 10  # DashScope text-embedding-v4 max 10/request

  # Parser Configuration (K1) — pluggable document parser (renamed from loader).
  # Switching formats (pdf | pdf_text | docx | ...) is config-only via ParserFactory.
  parser:
    provider: "docling"  # 默认 parser = Docling（DocLayNet + TableFormer）；矢量图 bbox 渲染见 D-019，降级链 docling→pdf_text 见 D-011
    extract_images: true  # extract embedded images, insert [IMAGE: id] placeholders
    page_batch_size: 0  # T23: 单次完整转换——分批转换（每批新 converter）同机间歇丢段；单批确定且完整（新机器内存足够；分批本是 16GB RAM workaround）
    ocr_mode: "auto"  # 工单03 OCR 探测路由：auto=按文件探测文本层（数字 PDF 不开 OCR 提速；无文本层仅对该文件自动开，不静默空索引）；always=强制开（docling 旧默认）；never=强制关
    parse_cache:  # D-036 解析缓存：--force 重灌从无损 JSON 重放（键=文件 SHA256），不再重付 docling 解析；版本戳不符自动重解析
      enabled: true  # 缺省 true；整个 parse_cache 块缺席 = 缓存关闭（pre-D-036 行为，块内不写 enabled 也是开）
      dir: "data/parsed"  # gitignored；条目布局 {dir}/{sha256}/manifest.json + batch_NNN.json

  # Chunker (工单04 / D-037): docling 路径（含重放）切分换 HybridChunker——章节回填(contextualize)/表头重复/小块合并/token 预算原生；
  # recursive = 切回旧 RecursiveCharacterTextSplitter 路径（后备路线入口，一行切换）。块缺席 = recursive（旧配置零改动）。
  chunker:
    provider: "hybrid_docling"
    max_tokens: 1000  # token 预算；与 tokenizer 配套（nomic-embed-text 口径，同 embedding 模型对齐）
    merge_peers: true  # 同标题下 undersized 块合并
    tokenizer_path: "D:/models/nomic-embed-text"  # 本地 tokenizer 目录（ModelScope 拉 nomic-ai/nomic-embed-text-v1 的 tokenizer 文件）；全程不访问 HF 网络

  chunk_refiner:
    use_llm: false  # 策略 C:先关 LLM 精炼层(溯源优先确定性),规则去噪层仍恒执行;不满意再开
    # When use_llm is false or LLM call fails, falls back to rule-based refinement
  
  # Metadata Enricher Configuration (C6)
  metadata_enricher:
    use_llm: false # Set to true to enable LLM-based enrichment (requires LLM config)
    # When use_llm is false or LLM call fails, falls back to rule-based enrichment

  # Table-chunk summarizer (工单05): section_type=table 的块获得 LLM 转述（≤120 token）
  # 拼在块文本前部——语义型表格查询走摘要，不依赖数字行的向量。按内容哈希持久缓存
  # （data/db/table_summary_cache.db），同一表格重灌不重复调用；调用失败该块退回无摘要
  # 形态，不阻塞摄入（D-005）。独立 provider/model（D-024 追记：摄入期允许云端），
  # 可整块切回本地（如 provider "ollama" / model "granite4.1:8b" / base_url "http://localhost:11434"）。
  # 块缺席 = 关（pre-工单05 行为）。
  table_summarizer:
    enabled: true
    provider: "deepseek"
    model: "deepseek-flash"
    max_summary_tokens: 120  # API 级硬上限；prompt 同步要求 ≤120 token
    # base_url / api_key 可选覆盖；不写 = provider 与主 llm 块相同时继承主块，
    # 否则用 provider 自身默认（deepseek 的 endpoint 不该喂给 ollama）。
