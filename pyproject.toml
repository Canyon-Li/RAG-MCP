[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modular-rag-mcp-server"
version = "0.1.0"
description = "A modular RAG (Retrieval-Augmented Generation) MCP Server for knowledge management"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
keywords = ["mcp", "rag", "retrieval", "llm", "knowledge-base"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pyyaml>=6.0",
    "langchain-text-splitters>=0.3.0",
    "chromadb>=0.4.0",
    "mcp>=1.0.0,<2",  # mcp 2.x renames camelCase fields (isError→is_error) and drops Server.list_tools; code/tests target 1.x
    "jieba>=0.42",
    "markitdown[pdf]>=0.1.0",
    "python-docx>=1.1.0",  # J2: WordLoader fallback text extraction (and test fixtures)
    "pdfplumber>=0.10.0",  # K4′: PdfTableParser native table extraction
    "streamlit>=1.30.0",
    "ragas==0.4.3",  # T10 gauge calibration: minor versions break scoring APIs; judge metrics are version-sensitive
    "rapidfuzz>=3.0",  # T21: ragas testset OverlapScoreBuilder optional dep (NER overlap relationships)
    "datasets>=2.0.0",
    # Runtime providers & parsers — previously only survived via transitive deps
    "openai>=1.0",  # embedding/vision providers (OpenAIEmbedding, OpenAIVisionLLM) + ragas
    "httpx>=0.24.0",  # DeepSeekLLM and OpenAI-compatible HTTP clients
    "requests>=2.28.0",  # AzureVisionLLM REST call (azure_vision_llm.py)
    "PyMuPDF>=1.23.0",  # import as fitz — PdfTextParser / PdfTableParser
    "python-dotenv>=1.0",  # evaluate.py .env loading (DEEPSEEK_API_KEY etc.)
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "pytest-mock>=3.14",
    "ruff>=0.1.0",
    "mypy>=1.0",
]
cross-encoder = [
    # CrossEncoderReranker — heavy, pulls torch; install via ".[cross-encoder]"
    "sentence-transformers>=2.2.0",
]
docling = [
    # DoclingParser / DoclingVlmParser — default parser since D-011, heavy (torch); install via ".[docling]"
    "docling>=2.0",
]

[project.scripts]
mcp-server = "src.mcp_server.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (may require external services)",
    "e2e: End-to-end tests (full system tests)",
    "llm: marks tests that require real LLM API calls (deselect with '-m \"not llm\"')",
    "slow: Slow tests that should be run less frequently",
]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.hatch.build.targets.wheel]
packages = ["src"]
